# Grant akses untuk folder aplikasi Laravel.
#
# Dua hal yang wajib:
# 1. AllowOverride All  -> public/.htaccess (rewrite ke index.php) dipakai.
# 2. Grant untuk /var/www/html/storage -> supaya symlink public/storage
#    (yang menunjuk ke storage/app/public) bisa dibaca untuk file hasil upload.

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Jangan pernah listing isi storage dari browser.
<Directory /var/www/html/storage>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html/bootstrap>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# Tolak akses langsung ke file sumber PHP di luar document root.
<FilesMatch "\.(env|log|sql|md|json|lock|ya?ml)$">
    Require all denied
</FilesMatch>

# ---------------------------------------------------------------------------
# Kebijakan cache aset
# ---------------------------------------------------------------------------
# Vite menghasilkan nama file ber-hash (app-DZv-rd5_.css). Begitu isinya berubah,
# nama filenya ikut berubah, sehingga browser TIDAK akan pernah meminta versi lama
# lagi - aman diberi cache permanen. Tanpa ini, setiap navigasi meminta ulang
# kedua file itu walaupun isinya tidak berubah.
#
# File upload pakai nama acak yang dihasilkan Laravel per unggahan, jadi file lama
# tidak pernah ditimpa - juga aman untuk cache permanen.
# ---------------------------------------------------------------------------
<Directory /var/www/html/public/build>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>

<DirectoryMatch "/var/www/html/storage/app/public/">
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</DirectoryMatch>
