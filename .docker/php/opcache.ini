; ---------------------------------------------------------------------------
; OPcache tuning
; ---------------------------------------------------------------------------
; File ini di-copy ke /usr/local/etc/php/conf.d/opcache.ini. File resmi dari
; docker-php-ext-install (docker-php-ext-opcache.ini) hanya berisi zend_extension
; sehingga seluruh pengaturan di bawah sebelumnya memakai nilai default PHP.

; Opini utama PHP untuk mod_php sudah "On", dipertegas agar tidak berubah bila
; base image di-upgrade.
opcache.enable=1

; Default 128 MB. Proyek ini kini memuat 7800 file PHP dari vendor+app+config,
; hampir 80% dari default max_accelerated_files (10000). Bila melewati batas itu,
; opcache diam-diam berhenti meng-cache file baru - sulit dikenali sebagai bug.
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10
opcache.interned_strings_buffer=16

; validate_timestamps tetap 1, sengaja. Kode proyek ini di-bind mount dan sangat
; sering diedit; bila dimatikan, setiap perubahan kode mewajibkan restart container.
; revalidate_freq diturunkan dari default 2 ke 1 supaya perubahan terdeteksi maksimal
; 1 detik, bukan 2 detik.
opcache.validate_timestamps=1
opcache.revalidate_freq=1

; Wajib untuk komentar PHP eksplisit Blade dan PHP attributes.
opcache.save_comments=1

; JIT sengaja TIDAK diaktifkan (opcache.jit_buffer_size tetap default 0).
; JIT menolong beban CPU murni, sedangkan Laravel lebih dominan pada I/O:
; query database dan pembacaan file.
opcache.jit_buffer_size=0
